<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 视频生成 · Coze 工作流</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --violet:#7c6cff;
    --cyan:#35e6f0;
    --pink:#ff6ec7;
    --text:#eef1f8;
    --muted:#8b93a7;
    --muted-2:#6b7386;
    --border:rgba(255,255,255,.085);
    --glass:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.022));
    --ok:#3ddc97;
    --danger:#ff6b7a;
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:#06070d;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }

  /* ================= 背景装饰 ================= */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bg::before{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:radial-gradient(ellipse 100% 65% at 50% 0%,#000 15%,transparent 78%);
    mask-image:radial-gradient(ellipse 100% 65% at 50% 0%,#000 15%,transparent 78%);
  }
  .orb{position:absolute;border-radius:50%;filter:blur(100px);will-change:transform}
  .orb-1{width:560px;height:560px;top:-220px;left:-140px;background:radial-gradient(circle,rgba(124,108,255,.85),transparent 68%);opacity:.5;animation:drift1 20s ease-in-out infinite}
  .orb-2{width:500px;height:500px;top:-160px;right:-140px;background:radial-gradient(circle,rgba(53,230,240,.7),transparent 68%);opacity:.42;animation:drift2 26s ease-in-out infinite}
  .orb-3{width:440px;height:440px;bottom:-230px;left:42%;background:radial-gradient(circle,rgba(255,110,199,.55),transparent 68%);opacity:.24;animation:drift1 32s ease-in-out infinite reverse}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,50px) scale(1.08)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,60px) scale(1.1)}}

  /* ================= 布局 ================= */
  .wrap{
    position:relative;z-index:1;
    max-width:1200px;margin:0 auto;
    padding:48px 22px 90px;
    animation:rise .7s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  /* ================= 头部 ================= */
  .hero{text-align:center;margin-bottom:38px}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;
    padding:7px 15px;border-radius:999px;margin-bottom:20px;
    color:#c8c2ff;
    border:1px solid rgba(124,108,255,.4);
    background:rgba(124,108,255,.1);
    box-shadow:0 0 0 1px rgba(124,108,255,.08), 0 8px 24px -14px rgba(124,108,255,.9);
  }
  .badge .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 10px var(--cyan);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .hero h1{
    font-size:clamp(30px,4.6vw,46px);
    font-weight:800;letter-spacing:-1.4px;line-height:1.15;
    background:linear-gradient(115deg,#ffffff 8%,#b9b1ff 45%,#5fe7f5 88%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    padding-bottom:4px;
  }
  .hero p{color:var(--muted);font-size:14.5px;margin-top:14px;letter-spacing:.2px}

  /* ================= 卡片 ================= */
  .card{
    position:relative;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:22px;
    backdrop-filter:blur(22px) saturate(150%);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
    box-shadow:
      0 30px 70px -34px rgba(0,0,0,.95),
      inset 0 1px 0 rgba(255,255,255,.07);
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:12%;right:12%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);
    pointer-events:none;
  }

  /* ================= 接口设置 ================= */
  .settings{margin-bottom:22px}
  .settings summary{
    list-style:none;cursor:pointer;user-select:none;
    padding:17px 24px;font-size:13.5px;font-weight:600;color:#ccd3e3;
    display:flex;align-items:center;gap:10px;
    transition:background .25s;
  }
  .settings summary::-webkit-details-marker{display:none}
  .settings summary:hover{background:rgba(255,255,255,.028)}
  .settings summary .gear{
    font-size:15px;transition:transform .5s cubic-bezier(.22,1,.36,1);
    display:inline-block;
  }
  .settings[open] summary .gear{transform:rotate(120deg)}
  .settings summary .chev{
    margin-left:auto;font-size:11px;color:var(--muted-2);
    transition:transform .3s cubic-bezier(.22,1,.36,1);
  }
  .settings[open] summary .chev{transform:rotate(180deg)}

  /* 配置完整性提示 */
  .cfg-state{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:600;letter-spacing:.3px;
    padding:3px 10px;border-radius:999px;
    color:#7f8798;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.07);
    transition:color .25s,background .25s,border-color .25s;
  }
  .cfg-state::before{
    content:"";width:5px;height:5px;border-radius:50%;
    background:#5a6274;transition:background .25s,box-shadow .25s;
  }
  .cfg-state.ok{
    color:#8ff0c4;background:rgba(61,220,151,.1);
    border-color:rgba(61,220,151,.28);
  }
  .cfg-state.ok::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}

  .settings-body{
    padding:6px 24px 24px;
    border-top:1px solid rgba(255,255,255,.055);
    display:grid;grid-template-columns:1fr 1fr;gap:18px;
    animation:fadeIn .35s ease both;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .settings-body .full{grid-column:1/-1}
  @media(max-width:760px){.settings-body{grid-template-columns:1fr}}

  /* ================= 表单 ================= */
  .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:start}
  @media(max-width:940px){.grid{grid-template-columns:1fr}}

  .panel{padding:26px 26px 28px}
  .panel-title{
    font-size:14.5px;font-weight:700;letter-spacing:.2px;
    display:flex;align-items:center;gap:10px;margin-bottom:22px;
  }
  .panel-title .bar{
    width:3px;height:15px;border-radius:99px;
    background:linear-gradient(180deg,var(--violet),var(--cyan));
    box-shadow:0 0 12px rgba(124,108,255,.7);
  }
  .panel-title .sub{
    margin-left:auto;font-size:11.5px;font-weight:500;color:var(--muted-2);
    letter-spacing:.3px;
  }

  .field{margin-bottom:18px;position:relative}
  .field > label{
    display:flex;align-items:center;gap:7px;
    font-size:12.5px;font-weight:600;color:#a3abbf;
    margin-bottom:9px;letter-spacing:.2px;
  }
  .field .req{color:var(--danger);font-size:13px;line-height:1}
  .field .opt{color:var(--muted-2);font-weight:500;font-size:11px;margin-left:2px}

  input[type=text],input[type=password],textarea{
    width:100%;
    background:rgba(0,0,0,.32);
    border:1px solid rgba(255,255,255,.075);
    border-radius:13px;
    padding:13px 15px;
    color:var(--text);
    font-size:14px;font-family:inherit;
    outline:none;
    transition:border-color .22s,box-shadow .22s,background .22s;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.35);
  }
  input::placeholder,textarea::placeholder{color:#525b6e}
  input:hover,textarea:hover{border-color:rgba(255,255,255,.14)}
  input:focus,textarea:focus{
    border-color:rgba(124,108,255,.8);
    background:rgba(0,0,0,.4);
    box-shadow:
      inset 0 1px 3px rgba(0,0,0,.35),
      0 0 0 3.5px rgba(124,108,255,.15),
      0 0 26px -8px rgba(124,108,255,.85);
  }
  textarea{min-height:180px;resize:vertical;line-height:1.7;padding-bottom:30px}
  .hint{font-size:11.5px;color:var(--muted-2);margin-top:7px;line-height:1.55}
  .counter{
    position:absolute;right:14px;bottom:10px;
    font-size:11px;color:#525b6e;pointer-events:none;
    font-variant-numeric:tabular-nums;
  }

  /* ================= 勾选 ================= */
  .check{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    font-size:13px;color:#aab2c4;user-select:none;
    padding:9px 12px;border-radius:11px;
    transition:background .2s;
  }
  .check:hover{background:rgba(255,255,255,.03)}
  .check input{
    appearance:none;-webkit-appearance:none;
    width:18px;height:18px;flex:none;
    border:1.5px solid rgba(255,255,255,.22);
    border-radius:6px;background:rgba(0,0,0,.35);
    cursor:pointer;position:relative;
    transition:background .2s,border-color .2s,box-shadow .2s;
  }
  .check input:hover{border-color:rgba(255,255,255,.4)}
  .check input:checked{
    background:linear-gradient(135deg,var(--violet),var(--cyan));
    border-color:transparent;
    box-shadow:0 0 14px -2px rgba(124,108,255,.9);
  }
  .check input:checked::after{
    content:"";position:absolute;left:6px;top:2.5px;
    width:4px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }

  /* ================= 按钮 ================= */
  .btn{
    position:relative;overflow:hidden;
    width:100%;border:none;cursor:pointer;
    padding:15px 22px;border-radius:14px;
    font-size:15px;font-weight:700;letter-spacing:.3px;
    font-family:inherit;color:#fff;
    background:linear-gradient(120deg,#6d5efc 0%,#8b6cff 45%,#35d9e8 100%);
    background-size:180% 100%;
    box-shadow:
      0 16px 34px -14px rgba(109,94,252,.95),
      inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .25s,background-position .6s;
  }
  .btn::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.42) 50%,transparent 70%);
    transform:translateX(-130%);
    transition:transform .75s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  .btn:hover:not([disabled]){
    transform:translateY(-2px);
    background-position:100% 0;
    box-shadow:
      0 22px 42px -14px rgba(109,94,252,1),
      inset 0 1px 0 rgba(255,255,255,.32);
  }
  .btn:hover:not([disabled])::after{transform:translateX(130%)}
  .btn:active:not([disabled]){transform:translateY(0) scale(.988)}
  .btn[disabled]{opacity:.62;cursor:not-allowed;box-shadow:none}
  .btn.ghost{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    width:auto;padding:11px 19px;border-radius:12px;
    font-size:13px;font-weight:600;text-decoration:none;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:none;color:#d5dbe8;
    transition:background .2s,border-color .2s,transform .2s;
  }
  .btn.ghost:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
  .btn.ghost::after{display:none}
  .spinner{
    display:inline-block;width:15px;height:15px;vertical-align:-2.5px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;
    margin-right:9px;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ================= 进度 ================= */
  .progress{
    height:3px;border-radius:99px;overflow:hidden;
    background:rgba(255,255,255,.07);
    margin-top:16px;
    opacity:0;height:0;transition:opacity .3s,height .3s,margin .3s;
  }
  .progress.on{opacity:1;height:3px;margin-top:16px}
  .progress i{
    display:block;height:100%;width:38%;border-radius:99px;
    background:linear-gradient(90deg,transparent,var(--violet),var(--cyan),transparent);
    animation:slide 1.35s ease-in-out infinite;
  }
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}

  /* ================= 状态 ================= */
  .status{
    margin-top:14px;font-size:13px;line-height:1.6;
    min-height:0;color:var(--muted);
    word-break:break-word;
    display:flex;align-items:flex-start;gap:8px;
    opacity:0;transition:opacity .3s;
  }
  .status.on{opacity:1;min-height:20px}
  .status .ico{flex:none;line-height:1.5}
  .status.ok{color:var(--ok)}
  .status.error{color:var(--danger)}

  /* ================= 结果区 ================= */
  .stage{display:flex;flex-direction:column;gap:14px;min-height:340px}
  .stage video{
    width:100%;display:block;border-radius:16px;background:#000;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 26px 54px -24px rgba(0,0,0,1), 0 0 0 1px rgba(255,255,255,.02);
    animation:fadeIn .5s ease both;
  }
  .empty{
    flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;min-height:338px;
    border:1.5px dashed rgba(255,255,255,.1);
    border-radius:16px;
    background:radial-gradient(ellipse at 50% 40%,rgba(124,108,255,.07),transparent 68%);
    color:#5f6879;font-size:13.5px;text-align:center;
    padding:30px 24px;line-height:1.7;
  }
  .empty .ico{
    font-size:40px;line-height:1;opacity:.6;
    filter:drop-shadow(0 8px 22px rgba(124,108,255,.5));
  }
  .empty .t1{color:#8b93a7;font-size:14px;font-weight:600}
  .empty .t2{color:#5a6274;font-size:12.5px}

  /* 骨架屏 */
  .skeleton{
    position:relative;overflow:hidden;
    min-height:338px;border-radius:16px;
    border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  }
  .skeleton::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.07) 50%,transparent 75%);
    animation:sweep 1.5s ease-in-out infinite;
  }
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .ring{
    width:46px;height:46px;border-radius:50%;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:var(--violet);
    border-right-color:var(--cyan);
    animation:spin .9s linear infinite;
  }
  .skeleton p{font-size:13px;color:var(--muted);letter-spacing:.3px}

  /* 原始返回 */
  .raw{margin-top:2px}
  .raw summary{
    cursor:pointer;list-style:none;
    font-size:12.5px;color:var(--muted-2);
    padding:9px 2px;user-select:none;
    transition:color .2s;
  }
  .raw summary::-webkit-details-marker{display:none}
  .raw summary:hover{color:var(--muted)}
  .raw summary::before{content:"▸ ";display:inline-block;transition:transform .2s}
  .raw[open] summary::before{content:"▾ "}
  .raw pre{
    margin-top:8px;max-height:250px;overflow:auto;
    background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.07);
    border-radius:12px;padding:13px;
    font-size:11.5px;line-height:1.65;color:#9fb0c9;
    white-space:pre-wrap;word-break:break-all;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    animation:fadeIn .3s ease both;
  }
  .raw pre::-webkit-scrollbar{width:7px;height:7px}
  .raw pre::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
  .raw pre::-webkit-scrollbar-track{background:transparent}

  /* 结果操作条 */
  .actions{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
</div>

<div class="wrap">

  <!-- ================= 头部 ================= -->
  <header class="hero">
    <div class="badge"><span class="dot"></span>Coze Workflow API</div>
    <h1>AI 视频生成工作台</h1>
    <p>输入主题与题目数据，一键调用工作流，自动生成视频</p>
  </header>

  <!-- ================= 接口设置 ================= -->
  <details class="card settings">
    <summary>
      <span class="gear">⚙️</span>接口设置
      <span class="cfg-state" id="cfgState">未配置</span>
      <span class="chev">▾</span>
    </summary>
    <div class="settings-body">
      <div class="field full">
        <label>API 地址</label>
        <input type="text" id="apiBase" value="https://api.coze.cn" spellcheck="false" />
        <div class="hint">浏览器直连可能被跨域（CORS）拦截，此时请填写你自己的后端代理地址</div>
      </div>
      <div class="field">
        <label>API Token <span class="req">*</span></label>
        <input type="password" id="token" placeholder="pat_xxxxxxxxxxxxxxxx" spellcheck="false" autocomplete="off" />
      </div>
      <div class="field">
        <label>Workflow ID <span class="req">*</span></label>
        <input type="text" id="workflowId" placeholder="7694087368063991835" spellcheck="false" />
      </div>
      <div class="field full">
        <label>Bot ID <span class="opt">可选</span></label>
        <input type="text" id="botId" placeholder="7xxxxxxxxxxxxxxxxxx（留空则不传 bot_id）" spellcheck="false" />
        <div class="hint">若工作流已绑定在某个 Bot 下，可填写该 Bot ID，请求时会以 <code style="color:#8f97aa">bot_id</code> 字段一并提交</div>
      </div>
      <div class="field">
        <label>题目数据参数名 <span class="opt">默认 data</span></label>
        <input type="text" id="dataKey" value="data" spellcheck="false" />
      </div>
      <div class="field">
        <label>主题参数名 <span class="opt">默认 topic</span></label>
        <input type="text" id="topicKey" value="topic" spellcheck="false" />
      </div>
      <div class="full" style="margin-top:-4px">
        <label class="check">
          <input type="checkbox" id="remember" checked />
          <span>记住配置（保存在本地浏览器）</span>
        </label>
      </div>
    </div>
  </details>

  <!-- ================= 主体 ================= -->
  <div class="grid">

    <!-- 输入面板 -->
    <section class="card panel">
      <div class="panel-title">
        <span class="bar"></span>创作内容
      </div>

      <div class="field">
        <label>主题 <span class="req">*</span></label>
        <input type="text" id="topic" maxlength="100" placeholder="例如：长征知识大挑战" value="长征知识大挑战" />
      </div>

      <div class="field">
        <label>题目数据 (JSON 数组) <span class="req">*</span></label>
        <textarea id="dataJson" placeholder='请粘贴 JSON 数组，例如：[{"OKcode":"A","OKoption":"A 735天","optionA":"A  735天","optionB":"B  365天","optionC":"C  500天","optionD":"","optionE":"","optionF":"","question":"红军长征一共历时多少天？","title":"问题1"}]'></textarea>
        <div class="counter"><span id="count">0</span> 字符</div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn ghost" id="fillSample">填充示例数据</button>
          <button type="button" class="btn ghost" id="clearData">清空</button>
        </div>
      </div>

      <button class="btn" id="submit">✨ 生成视频</button>

      <div class="progress" id="progress"><i></i></div>
      <div class="status" id="status"></div>
    </section>

    <!-- 结果面板 -->
    <section class="card panel">
      <div class="panel-title">
        <span class="bar"></span>生成结果
        <span class="sub" id="stageHint"></span>
      </div>
      <div class="stage" id="stage">
        <div class="empty">
          <div class="ico">🎬</div>
          <div class="t1">视频将在这里展示</div>
          <div class="t2">填写左侧内容后点击「生成视频」</div>
        </div>
      </div>
    </section>

  </div>
</div>

<script>
/* =========================================================
 *  基础工具
 * ========================================================= */
const $ = (s) => document.querySelector(s);

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function parseMaybe(v) {
  if (typeof v !== 'string') return v;
  const s = v.trim();
  if ((s.startsWith('{') && s.endsWith('}')) || (s.startsWith('[') && s.endsWith(']'))) {
    try { return JSON.parse(s); } catch (e) { /* 保持原样 */ }
  }
  return v;
}

/* 从任意嵌套结构中提取视频地址 */
function extractVideoUrl(data) {
  let result = null;
  const videoExt = /\.(mp4|mov|webm|m3u8|avi|mkv)(\?.*)?$/i;

  const visit = (val, key) => {
    if (result) return;

    if (typeof val === 'string') {
      const s = val.trim();
      if (!s) return;

      if (/^https?:\/\//i.test(s)) {
        if (videoExt.test(s) || /video|mp4|play/i.test(key || '')) {
          result = s; return;
        }
      }
      if (s.startsWith('{') || s.startsWith('[')) {
        try { visit(JSON.parse(s)); } catch (e) {}
      }
    } else if (Array.isArray(val)) {
      val.forEach(v => visit(v));
    } else if (val && typeof val === 'object') {
      Object.keys(val).forEach(k => visit(val[k], k));
    }
  };

  visit(data);
  return result;
}

/* =========================================================
 *  配置持久化
 * ========================================================= */
const CFG_KEY = 'coze_video_gen_cfg_v2';
const CFG_FIELDS = ['apiBase', 'token', 'workflowId', 'botId', 'dataKey', 'topicKey'];

(function restoreConfig() {
  try {
    const saved = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
    CFG_FIELDS.forEach(k => {
      if (saved[k] !== undefined && saved[k] !== '') $('#' + k).value = saved[k];
    });
  } catch (e) {}
  refreshCfgState();
})();

function saveConfig() {
  if (!$('#remember').checked) return;
  const cfg = {};
  CFG_FIELDS.forEach(k => cfg[k] = $('#' + k).value.trim());
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
}

function readConfig() {
  return {
    base: ($('#apiBase').value.trim() || 'https://api.coze.cn').replace(/\/+$/, ''),
    token: $('#token').value.trim(),
    workflowId: $('#workflowId').value.trim(),
    botId: $('#botId').value.trim(),
    dataKey: $('#dataKey').value.trim() || 'data',
    topicKey: $('#topicKey').value.trim() || 'topic'
  };
}

/* 配置完整性提示 */
function refreshCfgState() {
  const el = $('#cfgState');
  const cfg = readConfig();
  const ready = !!(cfg.token && cfg.workflowId);
  el.classList.toggle('ok', ready);
  el.textContent = ready
    ? (cfg.botId ? '已配置 · 含 Bot' : '已配置')
    : '未配置';
}

 *  UI 状态

const statusEl  = $('#status');
const submitBtn = $('#submit');
const stageEl   = $('#stage');
const progressEl= $('#progress');
const stageHint = $('#stageHint');

function setStatus(text, type = '') {
  if (!text) {
    statusEl.className = 'status';
    statusEl.innerHTML = '';
    return;
  }
  const icon = type === 'error' ? '⛔' : type === 'ok' ? '✅' : '◈';
  statusEl.className = 'status on' + (type ? ' ' + type : '');
  statusEl.innerHTML = `<span class="ico">${icon}</span><span>${escapeHtml(text)}</span>`;
}

function setLoading(on) {
  submitBtn.disabled = on;
  submitBtn.innerHTML = on
    ? '<span class="spinner"></span>生成中，请稍候…'
    : '✨ 生成视频';
  progressEl.classList.toggle('on', on);
}

function setStageEmpty(icon, t1, t2) {
  stageHint.textContent = '';
  stageEl.innerHTML = `
    <div class="empty">
      <div class="ico">${icon}</div>
      <div class="t1">${escapeHtml(t1)}</div>
      ${t2 ? `<div class="t2">${escapeHtml(t2)}</div>` : ''}
    </div>`;
}

function setStageLoading(text) {
  stageHint.textContent = '';
  stageEl.innerHTML = `
    <div class="skeleton">
      <div class="ring"></div>
      <p>${escapeHtml(text || '正在生成视频…')}</p>
    </div>`;
}

/* =========================================================
 *  核心：流式调用 Coze 工作流
 * ========================================================= */
async function streamWorkflow(payload, onProgress) {
  const cfg = readConfig();

  if (!cfg.token)      throw new Error('请先在「接口设置」中填写 API Token');
  if (!cfg.workflowId) throw new Error('请先在「接口设置」中填写 Workflow ID');

  onProgress('正在连接工作流…');

  const resp = await fetch(cfg.base + '/v1/workflow/stream_run', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + cfg.token,
      'Accept': 'text/event-stream'
    },
    body: JSON.stringify(payload)
  });

  if (!resp.ok) {
    let errText = '';
    try { errText = await resp.text(); } catch (e) {}
    throw new Error(`HTTP ${resp.status} ${resp.statusText}${errText ? ' · ' + errText.slice(0, 200) : ''}`);
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  const allEvents = [];

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });

    // SSE 事件以 \n\n 分隔
    const parts = buffer.split('\n\n');
    buffer = parts.pop(); // 剩余未完整部分

    for (const part of parts) {
      const lines = part.split('\n');
      for (const line of lines) {
        if (line.startsWith('data:')) {
          const dataStr = line.slice(5).trim();
          if (dataStr === '[DONE]') continue;
          try {
            const obj = JSON.parse(dataStr);
            allEvents.push(obj);
            // 尝试提取内容更新进度
            if (obj.content) onProgress(obj.content);
            else if (obj.message) onProgress(obj.message);
          } catch (e) { /* 忽略非 JSON 行 */ }
        }
      }
    }
  }

  // 处理尾部残留
  if (buffer.trim()) {
    const lines = buffer.split('\n');
    for (const line of lines) {
      if (line.startsWith('data:')) {
        const dataStr = line.slice(5).trim();
        if (dataStr === '[DONE]') continue;
        try { allEvents.push(JSON.parse(dataStr)); } catch (e) {}
      }
    }
  }

  return allEvents;
}

/* =========================================================
 *  结果渲染
 * ========================================================= */
function renderResult(events) {
  // 合并所有事件数据，或直接传入数组让提取器递归查找
  const combined = events.length === 1 ? events[0] : events;
  const videoUrl = extractVideoUrl(combined);

  if (videoUrl) {
    stageHint.textContent = '已完成';
    stageEl.innerHTML = `
      <video src="${escapeHtml(videoUrl)}" controls playsinline preload="metadata"></video>
      <div class="actions">
        <a class="btn ghost" href="${escapeHtml(videoUrl)}" target="_blank" rel="noopener">⬇ 下载 / 打开原视频</a>
      </div>
      <details class="raw">
        <summary>查看原始返回</summary>
        <pre>${escapeHtml(JSON.stringify(combined, null, 2))}</pre>
      </details>`;
  } else {
    stageHint.textContent = '未找到视频';
    stageEl.innerHTML = `
      <div class="empty">
        <div class="ico">📦</div>
        <div class="t1">未在返回结果中找到视频地址</div>
        <div class="t2">请检查工作流输出字段，或展开下方原始返回查看</div>
      </div>
      <details class="raw" open>
        <summary>查看原始返回</summary>
        <pre>${escapeHtml(JSON.stringify(combined, null, 2))}</pre>
      </details>`;
  }
}

/* =========================================================
 *  提交
 * ========================================================= */
submitBtn.addEventListener('click', async () => {
  const topicText = $('#topic').value.trim();
  const dataJsonText = $('#dataJson').value.trim();

  if (!topicText)   { setStatus('请填写主题', 'error'); $('#topic').focus(); return; }
  if (!dataJsonText) { setStatus('请填写题目数据', 'error'); $('#dataJson').focus(); return; }

  let dataArr;
  try {
    dataArr = JSON.parse(dataJsonText);
  } catch (e) {
    setStatus('题目数据 JSON 格式错误：' + e.message, 'error');
    return;
  }
  if (!Array.isArray(dataArr)) {
    setStatus('题目数据必须是一个 JSON 数组', 'error');
    return;
  }

  const cfg = readConfig();

  const parameters = {};
  parameters[cfg.dataKey] = dataArr;
  parameters[cfg.topicKey] = [topicText];

  const payload = {
    workflow_id: cfg.workflowId,
    parameters
  };
  if (cfg.botId) payload.bot_id = cfg.botId;

  saveConfig();
  refreshCfgState();
  setLoading(true);
  setStatus('正在准备…');
  setStageLoading('正在提交工作流…');

  try {
    const events = await streamWorkflow(payload, (msg) => setStatus(msg));
    renderResult(events);
    setStatus('视频生成完成', 'ok');
  } catch (err) {
    console.error(err);
    let msg = err.message || String(err);

    if (err instanceof TypeError && /fetch/i.test(msg)) {
      msg = '网络请求失败：可能是跨域（CORS）限制或 API 地址不可达。'
          + '请在「接口设置」中改用你自己的后端代理地址。';
    }
    setStatus(msg, 'error');
    setStageEmpty('⚠️', '生成失败', msg);
  } finally {
    setLoading(false);
  }
});

/* Ctrl / Cmd + Enter 快捷提交 */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !submitBtn.disabled) {
    submitBtn.click();
  }
});

/* 设置项变更时自动保存 + 刷新配置状态 */
CFG_FIELDS.forEach(id => {
  const el = $('#' + id);
  if (el) {
    el.addEventListener('change', () => { saveConfig(); refreshCfgState(); });
    el.addEventListener('input', refreshCfgState);
  }
});
