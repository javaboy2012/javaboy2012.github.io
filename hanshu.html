<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑色风格 · 顶点式 · 对称轴动态显示</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .card {
            max-width: 1100px;
            width: 100%;
            background: #141a24;
            border-radius: 48px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.04);
            padding: 28px 30px 35px;
            border: 1px solid #2a3442;
        }
        h1 {
            margin: 0 0 6px 0;
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.3px;
            color: #e8edf5;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .badge {
            background: #2c3d5a;
            color: #c8d8f0;
            padding: 4px 18px;
            border-radius: 80px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.06);
            letter-spacing: 0.2px;
            border: 1px solid #3e526e;
        }
        .subhead {
            margin: 0 0 20px 0;
            font-size: 1rem;
            color: #9aafc9;
            opacity: 0.8;
            font-weight: 400;
            border-left: 3px solid #5a7fb0;
            padding-left: 16px;
            background: rgba(58, 123, 181, 0.06);
            border-radius: 0 12px 12px 0;
        }
        .canvas-wrapper {
            background: #0f151e;
            border-radius: 32px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px #2a3442;
            padding: 12px;
            margin-bottom: 25px;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #0b0f16;
            border-radius: 24px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
            touch-action: none;
        }
        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px 25px;
            background: #111a26;
            padding: 20px 22px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid #2a3442;
            margin-top: 8px;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            font-size: 0.9rem;
            color: #b8cbdf;
            letter-spacing: 0.2px;
        }
        .slider-group label span:first-child {
            text-transform: uppercase;
            font-weight: 600;
            color: #b0cce6;
        }
        .slider-group label span:last-child {
            background: #253141;
            color: #dfeaf5;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            line-height: 1.8;
            min-width: 42px;
            text-align: center;
            border: 1px solid #3a4a5e;
        }
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: #253141;
            outline: none;
            transition: background 0.2s;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4d7db3;
            box-shadow: 0 2px 10px rgba(0, 40, 80, 0.5);
            border: 2px solid #aac2e0;
            cursor: pointer;
            transition: 0.08s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #5f8fc9;
        }
        input[type=range]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4d7db3;
            border: 2px solid #aac2e0;
            cursor: pointer;
        }
        .info-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding: 10px 18px;
            background: #0d141f;
            border-radius: 60px;
            border: 1px solid #253141;
            gap: 12px 16px;
        }
        .coord-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 16px;
            font-size: 0.95rem;
            color: #b8cbdf;
        }
        .coord-group span {
            font-weight: 500;
        }
        .coord-group .value {
            font-weight: 600;
            color: #d0e2f5;
            background: #1a2635;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 0.9rem;
            border: 1px solid #2f4057;
            line-height: 1.8;
        }
        .coord-group .highlight {
            color: #e68a6b;
        }
        .coord-group .highlight-bg {
            background: rgba(177, 62, 46, 0.15);
            padding: 0 8px;
            border-radius: 30px;
        }
        .reset-btn {
            background: #1d2838;
            border: 1px solid #364a62;
            padding: 6px 18px;
            border-radius: 60px;
            font-weight: 500;
            color: #c0d3ea;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .reset-btn:hover {
            background: #2a3a50;
            border-color: #5a7a9a;
            color: #e4edf7;
            transform: translateY(-1px);
        }
        .reset-btn:active {
            transform: scale(0.96);
        }
        .vertex-badge {
            background: #1f5c3a;
            color: #b8e0c8;
            padding: 0 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            line-height: 2;
            display: inline-block;
            letter-spacing: 0.3px;
            border: 1px solid #368a55;
        }
        .axis-badge {
            background: #4a3a6a;
            color: #d8c8f0;
            padding: 0 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            line-height: 2;
            display: inline-block;
            letter-spacing: 0.3px;
            border: 1px solid #7a5a9a;
        }
        @media (max-width: 700px) {
            .card { padding: 18px; }
            .control-grid { grid-template-columns: 1fr; gap: 12px; }
            .info-panel { flex-direction: column; align-items: stretch; border-radius: 30px; }
            .coord-group { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap;">
        <h1>
            <span>📐 顶点式 · 对称轴 & 坐标</span>
            <span class="badge">y = a(x − h)² + k</span>
        </h1>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <span class="vertex-badge">⏺ 顶点 (h, k)</span>
            <span class="axis-badge">⬛ 对称轴 x = h</span>
        </div>
    </div>
    <div class="subhead">
        ⚡ 拖动滑块调整系数 · 对称轴、顶点、x/y轴交点坐标实时显示
    </div>

    <div class="canvas-wrapper">
        <canvas id="graphCanvas" width="800" height="450"></canvas>
    </div>

    <div class="control-grid">
        <div class="slider-group">
            <label><span>a</span> <span id="aValue">1.00</span></label>
            <input type="range" id="aSlider" min="-3" max="3" step="0.01" value="1.2">
        </div>
        <div class="slider-group">
            <label><span>h</span> <span id="hValue">0.00</span></label>
            <input type="range" id="hSlider" min="-4" max="4" step="0.01" value="0.6">
        </div>
        <div class="slider-group">
            <label><span>k</span> <span id="kValue">0.00</span></label>
            <input type="range" id="kSlider" min="-4" max="4" step="0.01" value="-1.2">
        </div>
    </div>

    <div class="info-panel" id="infoPanel">
        <div class="coord-group">
            <span>🟢 顶点</span>
            <span class="value" id="vertexDisplay">(0.00, 0.00)</span>
        </div>
        <div class="coord-group">
            <span>🔵 x轴交点</span>
            <span class="value" id="xInterceptDisplay">—</span>
        </div>
        <div class="coord-group">
            <span>🟠 y轴交点</span>
            <span class="value" id="yInterceptDisplay">(0.00, 0.00)</span>
        </div>
        <div class="coord-group">
            <span>⬛ 对称轴</span>
            <span class="value" id="axisDisplay">x = 0.00</span>
        </div>
        <button class="reset-btn" id="resetDefaults">↺ 重置</button>
    </div>
</div>

<script>
    (function() {
        // DOM refs
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');

        const aSlider = document.getElementById('aSlider');
        const hSlider = document.getElementById('hSlider');
        const kSlider = document.getElementById('kSlider');
        const aValue = document.getElementById('aValue');
        const hValue = document.getElementById('hValue');
        const kValue = document.getElementById('kValue');
        const vertexDisplay = document.getElementById('vertexDisplay');
        const xInterceptDisplay = document.getElementById('xInterceptDisplay');
        const yInterceptDisplay = document.getElementById('yInterceptDisplay');
        const axisDisplay = document.getElementById('axisDisplay');
        const resetBtn = document.getElementById('resetDefaults');

        // 固定尺寸
        const W = 800, H = 450;
        canvas.width = W;
        canvas.height = H;

        // 坐标系范围
        const xMin = -5.0, xMax = 5.0, yMin = -4.5, yMax = 4.5;

        // 坐标转换
        function toPixelX(x) {
            return ((x - xMin) / (xMax - xMin)) * W;
        }
        function toPixelY(y) {
            return H - ((y - yMin) / (yMax - yMin)) * H;
        }

        // 绘制坐标标注（黑色风格适配）
        function drawCoordinateLabel(px, py, label, color = '#b0cce6', offsetX = 12, offsetY = -16) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.font = '600 13px "Segoe UI", sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 8;
            ctx.fillText(label, px + offsetX, py + offsetY);
            ctx.restore();
        }

        // 核心绘图
        function drawGraph(a, h, k) {
            ctx.clearRect(0, 0, W, H);

            // ----- 1. 网格 (暗色) -----
            ctx.save();
            ctx.strokeStyle = "#1e2a38";
            ctx.lineWidth = 0.8;
            for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x += 0.5) {
                if (Math.abs(x) < 0.01) continue;
                const px = toPixelX(x);
                ctx.beginPath();
                ctx.moveTo(px, 0);
                ctx.lineTo(px, H);
                ctx.stroke();
            }
            for (let y = Math.ceil(yMin); y <= Math.floor(yMax); y += 0.5) {
                if (Math.abs(y) < 0.01) continue;
                const py = toPixelY(y);
                ctx.beginPath();
                ctx.moveTo(0, py);
                ctx.lineTo(W, py);
                ctx.stroke();
            }
            ctx.restore();

            // ----- 2. 坐标轴 (亮灰) -----
            ctx.save();
            ctx.strokeStyle = "#8aa4c2";
            ctx.lineWidth = 2.2;
            const y0 = toPixelY(0);
            ctx.beginPath();
            ctx.moveTo(0, y0);
            ctx.lineTo(W, y0);
            ctx.stroke();
            const x0 = toPixelX(0);
            ctx.beginPath();
            ctx.moveTo(x0, 0);
            ctx.lineTo(x0, H);
            ctx.stroke();
            ctx.fillStyle = "#8aa4c2";
            ctx.beginPath();
            ctx.moveTo(W-8, y0-5);
            ctx.lineTo(W, y0);
            ctx.lineTo(W-8, y0+5);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x0-5, 8);
            ctx.lineTo(x0, 0);
            ctx.lineTo(x0+5, 8);
            ctx.fill();
            ctx.fillStyle = "#a0bada";
            ctx.font = "14px 'Segoe UI', sans-serif";
            ctx.fillText("x", W-22, y0-12);
            ctx.fillText("y", x0+12, 22);
            ctx.fillStyle = "#8aa4c2";
            ctx.font = "13px 'Segoe UI', sans-serif";
            ctx.fillText("O", x0-20, y0-8);
            ctx.restore();

            // ----- 3. 对称轴 (垂直虚线, 紫色) — 先绘制，让抛物线在上层 -----
            const axisX = h;
            ctx.save();
            if (axisX >= xMin && axisX <= xMax) {
                const px = toPixelX(axisX);
                ctx.setLineDash([6, 6]);
                ctx.strokeStyle = "#a07ad0";
                ctx.lineWidth = 2.2;
                ctx.shadowColor = "rgba(160, 120, 200, 0.2)";
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(px, 0);
                ctx.lineTo(px, H);
                ctx.stroke();
                ctx.setLineDash([]); // 重置
                // 对称轴标签
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#b89ae0";
                ctx.font = "600 13px 'Segoe UI', sans-serif";
                ctx.fillText(`x = ${axisX.toFixed(2)}`, px + 8, 30);
                // 对称轴小标记在底部
                ctx.fillStyle = "#b89ae0";
                ctx.font = "12px 'Segoe UI', sans-serif";
                ctx.fillText("⬛ 对称轴", px + 8, H - 12);
            }
            ctx.restore();

            // ----- 4. 顶点式抛物线 (亮橙红) -----
            const vertexX = h;
            const vertexY = k;

            ctx.save();
            ctx.strokeStyle = "#e0684a";
            ctx.lineWidth = 3.8;
            ctx.shadowColor = "rgba(200, 80, 40, 0.3)";
            ctx.shadowBlur = 14;
            ctx.beginPath();
            let first = true;
            const step = 0.02;
            for (let x = xMin; x <= xMax; x += step) {
                const y = a * (x - h) * (x - h) + k;
                if (y < yMin - 0.8 || y > yMax + 0.8) {
                    first = true;
                    continue;
                }
                const px = toPixelX(x);
                const py = toPixelY(y);
                if (first) {
                    ctx.moveTo(px, py);
                    first = false;
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.stroke();
            ctx.restore();

            // ----- 5. 计算关键点坐标 (顶点, x轴交点, y轴交点) -----
            const b = -2 * a * h;
            const c = a * h * h + k;
            const delta = b * b - 4 * a * c;

            // 顶点
            const vertexCoord = `(${h.toFixed(2)}, ${k.toFixed(2)})`;
            vertexDisplay.textContent = vertexCoord;

            // 对称轴
            axisDisplay.textContent = `x = ${h.toFixed(2)}`;

            // y轴交点
            const yIntercept = c;
            const yInterceptStr = `(0.00, ${yIntercept.toFixed(2)})`;
            yInterceptDisplay.textContent = yInterceptStr;

            // x轴交点
            let root1 = null, root2 = null;
            let xInterceptStr = '—';
            if (Math.abs(a) > 1e-9 && delta >= 0) {
                const sqrtDelta = Math.sqrt(delta);
                root1 = (-b - sqrtDelta) / (2 * a);
                root2 = (-b + sqrtDelta) / (2 * a);
                if (delta < 1e-9) {
                    xInterceptStr = `(${root1.toFixed(2)}, 0.00)  (重根)`;
                } else {
                    xInterceptStr = `(${root1.toFixed(2)}, 0.00) , (${root2.toFixed(2)}, 0.00)`;
                }
            } else if (Math.abs(a) > 1e-9 && delta < 0) {
                xInterceptStr = '无实数根';
            } else {
                xInterceptStr = '—';
            }
            xInterceptDisplay.textContent = xInterceptStr;

            // ----- 6. 绘制顶点 (亮绿) -----
            if (vertexX >= xMin && vertexX <= xMax && vertexY >= yMin && vertexY <= yMax) {
                const vx = toPixelX(vertexX);
                const vy = toPixelY(vertexY);
                ctx.save();
                ctx.shadowColor = "rgba(60, 200, 100, 0.25)";
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.arc(vx, vy, 8, 0, 2 * Math.PI);
                ctx.fillStyle = "#3ccf7a";
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = "#0b0f16";
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.restore();
                drawCoordinateLabel(vx, vy, `V${vertexCoord}`, '#6ae0a0', 14, -20);
            }

            // ----- 7. 绘制x轴交点 (亮蓝) -----
            if (a !== 0 && delta >= 0 && root1 !== null && root2 !== null) {
                ctx.save();
                const roots = [root1, root2];
                const uniqueRoots = roots.filter((r, idx) => {
                    if (idx === 0) return true;
                    return Math.abs(r - roots[0]) > 1e-6;
                });
                for (let r of uniqueRoots) {
                    if (r < xMin || r > xMax) continue;
                    const px = toPixelX(r);
                    const py = toPixelY(0);
                    ctx.shadowColor = "rgba(60, 140, 255, 0.25)";
                    ctx.shadowBlur = 18;
                    ctx.beginPath();
                    ctx.arc(px, py, 8, 0, 2 * Math.PI);
                    ctx.fillStyle = "#3b9eff";
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = "#0b0f16";
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                    const label = `(${r.toFixed(2)}, 0)`;
                    drawCoordinateLabel(px, py, label, '#7bbaff', 12, -18);
                }
                ctx.restore();
            }

            // ----- 8. 绘制y轴交点 (橙黄) -----
            const yInterceptX = 0;
            const yInterceptY = c;
            if (yInterceptX >= xMin && yInterceptX <= xMax && yInterceptY >= yMin && yInterceptY <= yMax) {
                const px = toPixelX(yInterceptX);
                const py = toPixelY(yInterceptY);
                ctx.save();
                ctx.shadowColor = "rgba(230, 160, 40, 0.25)";
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.arc(px, py, 7, 0, 2 * Math.PI);
                ctx.fillStyle = "#e8a03a";
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = "#0b0f16";
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.restore();
                drawCoordinateLabel(px, py, `(0, ${yInterceptY.toFixed(2)})`, '#f0b85a', 12, -18);
            }
        }

        // ----- 更新UI -----
        function updateAll() {
            const a = parseFloat(aSlider.value);
            const h = parseFloat(hSlider.value);
            const k = parseFloat(kSlider.value);

            aValue.textContent = a.toFixed(2);
            hValue.textContent = h.toFixed(2);
            kValue.textContent = k.toFixed(2);

            drawGraph(a, h, k);
        }

        // ----- 事件绑定 -----
        aSlider.addEventListener('input', updateAll);
        hSlider.addEventListener('input', updateAll);
        kSlider.addEventListener('input', updateAll);

        resetBtn.addEventListener('click', function() {
            aSlider.value = '1.0';
            hSlider.value = '0.0';
            kSlider.value = '0.0';
            updateAll();
        });

        canvas.addEventListener('dblclick', function() {
            resetBtn.click();
        });

        // 初始绘制
        updateAll();
    })();
</script>
</body>
</html>
