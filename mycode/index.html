<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>托幼机构保健医培训考试 · 练习题库</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    margin: 0; padding: 0 16px 60px;
    line-height: 1.7; color: #333;
    background: linear-gradient(180deg, #e8f4fd 0%, #eef6fd 300px, #eef6fd 100%);
    min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  header {
    text-align: center;
    padding: 48px 16px 28px;
  }
  header h1 {
    font-size: 28px; color: #1a4d7a;
    margin: 0 0 12px;
    letter-spacing: 1px;
  }
  header .subtitle {
    color: #5a7a94; font-size: 15px; margin: 0 0 26px;
  }
  header .stats-row {
    display: flex; justify-content: center; gap: 22px;
    flex-wrap: wrap; font-size: 14px; color: #4a6f8e;
  }
  header .stats-row b {
    color: #0095ff; font-size: 20px;
    display: inline-block; margin: 0 4px;
  }

  .search-wrap {
    max-width: 480px; margin: 24px auto 0;
    position: relative;
  }
  .search-wrap input {
    width: 100%; padding: 13px 18px 13px 46px;
    font-size: 15px; border: 2px solid #dbeaf7;
    border-radius: 28px; outline: none;
    background: #fff; transition: all .2s;
    font-family: inherit;
  }
  .search-wrap input:focus {
    border-color: #0095ff;
    box-shadow: 0 0 0 4px rgba(0,149,255,.12);
  }
  .search-wrap::before {
    content: "🔍"; position: absolute;
    left: 18px; top: 50%; transform: translateY(-50%);
    font-size: 16px; opacity: .55;
  }

  .tabs {
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: 10px; margin: 26px 0 10px;
  }
  .tab {
    padding: 7px 20px; font-size: 14px;
    background: #fff; color: #4a6f8e;
    border: 1.5px solid #dbeaf7; border-radius: 22px;
    cursor: pointer; transition: all .2s;
    user-select: none;
  }
  .tab:hover { border-color: #0095ff; color: #0095ff; }
  .tab.active {
    background: #0095ff; color: #fff;
    border-color: #0095ff;
    box-shadow: 0 4px 10px rgba(0,149,255,.3);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 30px;
  }

  .card {
    background: #fff; border-radius: 14px;
    padding: 22px 22px 20px;
    box-shadow: 0 4px 16px rgba(0,120,220,.08);
    border-top: 4px solid #0095ff;
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    transition: all .25s ease;
    position: relative; overflow: hidden;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 26px rgba(0,120,220,.18);
  }
  .card .cat {
    display: inline-block; font-size: 12px;
    padding: 2px 10px; border-radius: 10px;
    margin-bottom: 10px; font-weight: bold;
    align-self: flex-start;
  }
  .cat-blue   { background: #e6f4ff; color: #0074cc; }
  .cat-green  { background: #e9f9ef; color: #1a9e4b; }
  .cat-orange { background: #fff1e0; color: #d97000; }
  .cat-purple { background: #f0eaff; color: #6a3fbf; }
  .cat-red    { background: #fdeceb; color: #c0392b; }

  .card h3 {
    font-size: 17px; color: #1a4d7a;
    margin: 0 0 8px; line-height: 1.4;
  }
  .card p {
    font-size: 13.5px; color: #6a8ba3;
    margin: 0; line-height: 1.6; flex: 1;
  }
  .card .meta {
    margin-top: 16px; display: flex;
    justify-content: space-between; align-items: center;
    font-size: 13px; color: #95aabb;
    border-top: 1px dashed #e4eff9;
    padding-top: 12px;
  }
  .card .meta .count b {
    color: #0095ff; font-size: 15px;
  }
  .card .meta .go {
    color: #0095ff; font-weight: bold;
    display: flex; align-items: center; gap: 4px;
    transition: gap .2s;
  }
  .card:hover .meta .go { gap: 8px; }

  .empty {
    text-align: center; color: #95aabb;
    padding: 60px 20px; font-size: 15px;
    display: none;
  }

  footer {
    text-align: center; margin-top: 60px;
    font-size: 13px; color: #a3b8c8;
  }

  @media (max-width: 600px) {
    header { padding: 32px 8px 20px; }
    header h1 { font-size: 22px; }
    header .stats-row { font-size: 13px; gap: 14px; }
    header .stats-row b { font-size: 17px; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
    .card { padding: 18px 18px 16px; }
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <h1>🏥 托幼机构保健医培训考试</h1>
    <p class="subtitle">在线练习题库 · 即时判题 · 反复巩固</p>
    <div class="stats-row">
      <span>共 <b id="totalSets">14</b> 套试题</span>
      <span>合计 <b id="totalQuestions">—</b> 道题目</span>
      <span>分类 <b>4</b> 类</span>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="搜索试题名称，如「膳食」「口腔」…" autocomplete="off">
    </div>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">全部</div>
    <div class="tab" data-cat="卫生保健">卫生保健</div>
    <div class="tab" data-cat="膳食营养">膳食营养</div>
    <div class="tab" data-cat="疾病防控">疾病防控</div>
    <div class="tab" data-cat="培训真题">培训真题</div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">没有找到匹配的试题，试试其他关键词～</div>

  <footer>点击卡片进入练习 · 答错可重选 · 支持一键显示答案</footer>
</div>

<script>
/* ============ 试题清单（文件名与截图一一对应） ============ */
const sets = [
  { file: '01.html',   title: '4 健康检查',              cat: '卫生保健', count: 24, desc: '入园体检、定期体检、健康管理率等核心要点。' },
  { file: '03.html',   title: '一日生活制度',            cat: '卫生保健', count: 23, desc: '作息安排、饮水、进餐、睡眠、户外活动时间等。' },
  { file: '08.html',   title: '3 生长特点与评价',        cat: '卫生保健', count: 21, desc: '生长发育规律、体格测量、H/A、W/A、W/H 评价方法。' },
  { file: '04.html',   title: '5 儿童常见病与症状',      cat: '疾病防控', count: 32, desc: '发热出疹性疾病、疹型特点、出疹顺序、乙肝传播等。' },
  { file: '10.html',   title: '7 传染病管理',            cat: '疾病防控', count: 12, desc: '法定传染病分类、传播途径、检疫期、停课标准。' },
  { file: '05.html',   title: '9 体弱儿及肥胖儿管理',    cat: '疾病防控', count: 25, desc: '专案管理、贫血分级、肥胖/超重诊断标准、结案标准。' },
  { file: '09.html',   title: '10 儿童眼及视力保健',     cat: '疾病防控', count: 23, desc: '视力低常标准、视力检查方法、近视防控、用眼卫生。' },
  { file: '11.html',   title: '11 儿童耳朵及听力保健',   cat: '疾病防控', count: 12, desc: '听力筛查环境、仪器、测音强度、听性反应标准。' },
  { file: '07.html',   title: '12 儿童口腔保健',         cat: '疾病防控', count: 16, desc: '牙齿萌出、氟化物应用、牙菌斑、龋患率统计。' },
  { file: '12.html',   title: '14 膳食 1',                cat: '膳食营养', count: 18, desc: '六大营养素、常量微量元素、能量换算、维生素缺乏症。' },
  { file: '02.html',   title: '15 膳食 2',                cat: '膳食营养', count: 22, desc: '膳食委员会、营养计算、能量占比、食物推荐量。' },
  { file: '06.html',   title: '16 膳食 3',                cat: '膳食营养', count: 13, desc: '膳食管理等级、DRIS 达标要求、留样、进餐护理。' },
  { file: 'zt01.html', title: '培训真题 1',              cat: '培训真题', count: 50, desc: '50 题综合卷（34 单选 + 16 多选），覆盖十项制度。' },
  { file: 'zt05.html', title: '培训真题 5',              cat: '培训真题', count: 70, desc: '70 道单选题，涵盖解剖生理、生长发育、营养素等。' }
];

const catClass = {
  '卫生保健': 'cat-blue',
  '疾病防控': 'cat-green',
  '膳食营养': 'cat-orange',
  '培训真题': 'cat-red'
};

/* ============ 渲染 ============ */
const grid      = document.getElementById('grid');
const emptyEl   = document.getElementById('empty');
const searchEl  = document.getElementById('searchInput');
const tabsEl    = document.getElementById('tabs');

let curCat = 'all';
let curKw  = '';

function render() {
  const kw = curKw.trim().toLowerCase();
  const list = sets.filter(s => {
    const catOk = curCat === 'all' || s.cat === curCat;
    const kwOk  = !kw || s.title.toLowerCase().includes(kw) || s.desc.toLowerCase().includes(kw) || s.cat.includes(kw) || s.file.includes(kw);
    return catOk && kwOk;
  });

  if (list.length === 0) {
    grid.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  grid.innerHTML = list.map(s => `
    <a class="card" href="${s.file}">
      <span class="cat ${catClass[s.cat] || 'cat-blue'}">${s.cat}</span>
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
      <div class="meta">
        <span class="count">共 <b>${s.count}</b> 题</span>
        <span class="go">开始练习 →</span>
      </div>
    </a>
  `).join('');
}

/* 更新汇总 */
document.getElementById('totalSets').textContent = sets.length;
document.getElementById('totalQuestions').textContent = sets.reduce((a, s) => a + s.count, 0);

/* 搜索 */
searchEl.addEventListener('input', e => {
  curKw = e.target.value;
  render();
});

/* 分类 */
tabsEl.addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  tabsEl.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  curCat = t.dataset.cat;
  render();
});

render();
</script>
</body>
</html>
